name: Feature request
description: Suggest an improvement to Folio.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem, with a concrete example if possible.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: How would it help? Mention alternatives you have tried.
    validations:
      required: true
